name: BBK Daily Automation

on:
  schedule:
    # Berjalan otomatis setiap 3 jam sekali
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Memunculkan tombol manual "Run workflow" di halaman GitHub Actions
    inputs:
      manual_args:
        description: 'Argumen tanggal manual (contoh: --date 2026-08-25 atau --start 2026-08-01 --end 2026-08-25)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate credentials.json from Secret
        env:
          GSHEETS_CRED_JSON: ${{ secrets.GSHEETS_CRED_JSON }}
        run: |
          echo "$GSHEETS_CRED_JSON" > credentials.json

      - name: Generate bbk_session.session from Secret
        env:
          TELETHON_SESSION_BASE64: ${{ secrets.TELETHON_SESSION_BASE64 }}
        run: |
          python -c "import base64, gzip, os; open('bbk_session.session', 'wb').write(gzip.decompress(base64.b64decode(os.environ['TELETHON_SESSION_BASE64'])))"

      - name: Run Automation Pipeline
        run: |
          if [ "${{ github.event.inputs.manual_args }}" != "" ]; then
            python run_cloud.py ${{ github.event.inputs.manual_args }}
          else
            python run_cloud.py
          fi

      - name: Upload Processed Photos to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python upload_to_drive.py
