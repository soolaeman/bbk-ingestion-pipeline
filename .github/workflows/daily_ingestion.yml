name: BBKitchen Sovereign Telegram Ingestion

on:
  schedule:
    # 01:00 UTC = 08:00 WIB (Pagi) & 11:00 UTC = 18:00 WIB (Sore)
    - cron: '0 1,11 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run (run-all, fetch, normalize, sync, upload-r2)'
        required: false
        default: 'run-all'
        type: choice
        options:
          - run-all
          - fetch
          - normalize
          - sync
          - upload-r2
      days:
        description: 'Lookback days for Telegram fetch (default: 1, or enter 7, 14 for backlog)'
        required: false
        default: '1'
        type: string

jobs:
  ingest:
    name: Execute Sovereign Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore Telethon Session from Secret
        env:
          TELETHON_SESSION_BASE64: ${{ secrets.TELETHON_SESSION_BASE64 }}
        run: |
          if [ -n "$TELETHON_SESSION_BASE64" ]; then
            mkdir -p core
            python -c "import base64, gzip, os; open('core/bbk_session.session', 'wb').write(gzip.decompress(base64.b64decode(os.environ['TELETHON_SESSION_BASE64'])))"
            echo "Telethon session restored successfully."
          else
            echo "::warning ::TELETHON_SESSION_BASE64 secret is not set. Telegram fetch step may require interactive auth."
          fi

      - name: Run Sovereign Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HOLVER_API_KEY: ${{ secrets.HOLVER_API_KEY }}
          HOLVER_BASE_URL: ${{ secrets.HOLVER_BASE_URL || 'https://api.holver.id/v1' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.R2_BUCKET_NAME || 'bbk-assets' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_R2_PHOTO_BASE_URL: ${{ secrets.NEXT_PUBLIC_R2_PHOTO_BASE_URL }}
        run: |
          COMMAND="${{ github.event.inputs.command || 'run-all' }}"
          DAYS="${{ github.event.inputs.days || '1' }}"
          echo "Executing BBKitchen Pipeline: python bbk_pipeline.py $COMMAND --days $DAYS"
          python bbk_pipeline.py "$COMMAND" --days "$DAYS"

      - name: Commit and Push Updated Sovereign Database
        run: |
          git config user.name "BBKitchen Sovereign Bot"
          git config user.email "bot@bukanbarukitchen.com"
          git add bbk.db last_success.txt
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "feat(catalog): auto-ingest daily catalog updates [skip ci]"
            git push origin main
            echo "Updated bbk.db successfully committed and pushed to origin main."
          fi

      - name: Pipeline Execution Summary
        if: always()
        run: |
          echo "### 👑 BBKitchen Sovereign Ingestion Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode:** ${{ github.event.inputs.command || 'run-all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u) (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status == 'success' && '✅ SUCCESS' || '⚠️ COMPLETED WITH NOTICES' }}" >> $GITHUB_STEP_SUMMARY
